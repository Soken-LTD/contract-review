# contract/errors.yaml, plan copy. Owner: part 03 (M14). Part 04 owns rows with owner 04.
# channel: error = isError true; rejection = accepted false; status = review_status.error; report state; claim page.
# class: input = caller or source problem; server = Soken pause or fault (01 error-class metric).
# Templates are reference data; braces are server-filled values. Linted by the 04 text gate (server scope).
version: 1
codes:
  - code: E_INVALID_ARGUMENT
    owner: "03"
    channel: "error"
    class: "input"
    tools: "all"
    what: "Argument {field} breaks rule {rule}; received {value80}."
    fix: "Send a value inside the allowed range or pattern, for example {example}."
  - code: E_CURSOR_INVALID
    owner: "03"
    channel: "error"
    class: "input"
    tools: "paginated"
    what: "Cursor does not match this job, tool or filters."
    fix: "Repeat the call without cursor and with the same filters."
  - code: E_JOB_NOT_FOUND
    owner: "03"
    channel: "error"
    class: "input"
    tools: "all with job_id"
    what: "No job with this id."
    fix: "Start a new review; job ids start with job_."
  - code: E_JOB_EXPIRED
    owner: "03"
    channel: "error"
    class: "input"
    tools: "all with job_id except status, report, delete"
    what: "Job {job} expired on {date}."
    fix: "Start a new review; a cached build of the same source is reused."
  - code: E_INTERNAL
    owner: "03"
    channel: "error"
    class: "server"
    tools: "any"
    what: "Server error, incident {incident}."
    fix: "Retry once."
  - code: E_CHAIN_DISABLED
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "start"
    what: "Chain or chain id {value} is not enabled."
    fix: "Use one of: {enabled}."
  - code: E_DAILY_REPORT_LIMIT
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "start, finalize"
    what: "Daily report limit reached: {count} of {limit} reports in the last 24 hours."
    fix: "Wait until 24 hours have passed since the earliest of those reports, then finalize or start again."
  - code: E_CHAIN_PAUSED
    owner: "03"
    channel: "rejection"
    class: "server"
    tools: "start"
    what: "Reviews on {chain} are paused after a quality check."
    fix: "Try again later; the docs page shows the chain status."
  - code: E_CHAIN_ID_REQUIRED
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "start"
    what: "chain evm needs chain_id."
    fix: "Add chain_id, one of: {enabled}."
  - code: E_ADDRESS_INVALID
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "start"
    what: "Address does not match the {chain} format."
    fix: "Use {format}."
  - code: E_IMPORT_UNRESOLVED
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "start"
    what: "Import {import} in {file}:{line} resolves to nothing."
    fix: "Add the file, a dependencies entry or a remappings entry."
  - code: E_REPO_UNREACHABLE
    owner: "03"
    channel: "rejection or status"
    class: "input"
    tools: "start, status"
    what: "Repository {url} is not reachable without credentials."
    fix: "Use a public HTTPS URL on GitHub, GitLab or Codeberg. Private code: start with source kind upload."
  - code: E_PREVIOUS_REPORT
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "start"
    what: "Previous report {id} is unknown, not live, has another target, or the manage key does not match."
    fix: "Pass the report id and manage key of a live report on the same target, or omit both."
  - code: E_SOURCE_NOT_FOUND
    owner: "03"
    channel: "status"
    class: "input"
    tools: "status"
    what: "Source not found in the automatic sources ({providers})."
    fix: "Start again with repo and commit, files (a Standard JSON input as files with its compiler version and remappings), or an upload, each with deployment set to this address."
  - code: E_DEPENDENCY_UNRESOLVED
    owner: "03"
    channel: "status"
    class: "input"
    tools: "status"
    what: "The repository source was fetched, but these imported dependencies could not be resolved: {packages}."
    fix: "Commit the lockfile (package-lock.json, yarn.lock or pnpm-lock.yaml) that pins these packages from the public npm registry, or vendor them in the repository (lib/ with git submodules or committed files), then start a new review on that commit."
    what_files: "The pasted files import {packages}, and no pasted file or remapping resolves those imports."
    fix_files: "Paste the imported files too, at the path the import names (for example @openzeppelin/contracts/token/ERC20/ERC20.sol or node_modules/@openzeppelin/contracts/token/ERC20/ERC20.sol), or paste them under another folder and add a remapping in review_start.source.remappings (for example @openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/); then start a new review with all files in one call."
  - code: E_INSUFFICIENT_SOURCE
    owner: "03"
    channel: "status"
    class: "input"
    tools: "status"
    what: "Bytecode only (tier D)."
    fix: "Supply verified source, a repo commit, files or an upload."
  - code: E_COMMIT_NOT_FOUND
    owner: "03"
    channel: "status"
    class: "input"
    tools: "status"
    what: "Commit {commit} not found."
    fix: "Use the full 40-hex id of a commit in the repository."
  - code: E_COMMIT_AMBIGUOUS
    owner: "03"
    channel: "status"
    class: "input"
    tools: "status"
    what: "{value} matches several commits or both a branch and a tag: {matches}."
    fix: "Pass the full commit id."
  - code: E_UNPINNED_REF
    owner: "04"
    channel: "status"
    class: "input"
    tools: "status"
    what: "Branch or tag {ref} does not exist."
    fix: "Use an existing branch, tag or commit."
  - code: E_UPLOAD_INVALID
    owner: "03"
    channel: "status"
    class: "input"
    tools: "status"
    what: "Archive rejected: {reason}."
    fix: "Upload a .tar.gz or .zip within the size and file limits."
  - code: E_SIZE_LIMIT
    owner: "03"
    channel: "rejection or status"
    class: "input"
    tools: "start, status"
    what: "{measure} {value} is over the cap {cap}."
    fix: "Narrow scope.include; nSLOC per top directory: {dirs}."
  - code: E_HOST_CAPACITY
    owner: "03"
    channel: "status"
    class: "server"
    tools: "status"
    what: "Step {stage} needs {need_mb} MiB of memory; the worker host has {host_mb} MiB, so the step was not run."
    fix: "Start the review again later; it is scheduled on a worker with enough memory, never run into an out-of-memory kill."
  - code: E_TIER_UNKNOWN
    owner: "04"
    channel: "status"
    class: "server"
    tools: "status"
    what: "Adapter returned an unknown match value."
    fix: "None for the user; incident {incident}."
  - code: E_TIER_D
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools"
    what: "Bytecode only; findings cannot be written."
    fix: "Supply source as above."
  - code: E_JOB_NOT_READY
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "read, write, finalize, report"
    what: "Job is {state}, eta {eta_s} s."
    fix: "Call review_status with wait_seconds 45 and wait_for settled."
  - code: E_JOB_TERMINAL
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "read, write, finalize, report"
    what: "Job ended in {state}: {exit_code}."
    fix: "Apply the fix of {exit_code} and start a new review."
  - code: E_JOB_FROZEN
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "write tools"
    what: "Job is finalized."
    fix: "Start a new review for changes."
  - code: E_CAPACITY
    owner: "03"
    channel: "rejection"
    class: "server"
    tools: "start"
    what: "New reviews are paused by the operator; no job was created."
    fix: "Start the review again later; jobs already running are not affected."
  - code: E_RENDER_FAILED
    owner: "03"
    channel: "report state"
    class: "server"
    tools: "report, finalize"
    what: "Report could not be built; review data is kept. Cause: {detail}."
    fix: "Call review_finalize: the job reopens and renders again in that call. Only a failure on reviewer text (see detail) needs that text revised first."
  - code: E_FINALIZE_OPEN
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "finalize"
    what: "Open items: {items}."
    fix: "Close each item with the named tool."
  - code: E_FILE_UNKNOWN
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "read, submit, dismiss, answer"
    what: "Path {path} is not pinned."
    fix: "Closest paths: {paths}."
  - code: E_FILE_OUT_OF_SCOPE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit, dismiss, answer"
    what: "{path} is out of scope."
    fix: "Quote an in-scope file."
  - code: E_RANGE_INVALID
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "read, submit, dismiss, answer"
    what: "Range outside {path} ({lines} lines)."
    fix: "Use lines 1 to {lines}."
  - code: E_QUOTE_MISMATCH
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit, dismiss, answer, withdraw"
    what: "Quote does not match {path} lines {range}."
    fix: "Copy the lines in detail exactly, or change start and end."
  - code: E_QUOTE_ELISION
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit, dismiss, answer, withdraw"
    what: "More than one elision line."
    fix: "Use one ... line or two quotes."
  - code: E_QUOTE_TOO_LONG
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit, dismiss, answer, withdraw"
    what: "Quote longer than 40 lines."
    fix: "Quote the relevant lines only."
  - code: E_QUOTE_TRIVIAL
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit, dismiss, answer, withdraw"
    what: "Quote at {path}:{range} has no code tokens: only braces, imports, comments or blank lines."
    fix: "Quote a line that holds code, for example {suggest}. A pragma solidity line counts as code; an import-only or brace-only quote does not."
  - code: E_INJECTION_ECHO
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Text repeats flagged comment {flag} at {line}."
    fix: "Describe the code, not the comment."
  - code: E_TEXT_CONTROL_CHAR
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Control, format or bidi character {cp} at {pos}."
    fix: "Remove the character."
  - code: E_TEXT_SCRIPT
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Mixed or disallowed script at {pos}."
    fix: "Write in English."
  - code: E_TEXT_GATE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Rule {rule} ({rule_text}) matched {match}."
    fix: "Remove or reword the matched words ({match}): {reword} Send the call again; review_get_guide topic challenge_rules lists every text rule with its word list."
  - code: E_CODESPAN_NOT_IN_SOURCE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Code span {span} not found in pinned code."
    fix: "Quote it exactly or drop the backticks."
  - code: E_CODESPAN_UNGROUNDED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Code span {span} is not grounded in this finding's quotes."
    fix: "Quote the line that contains it."
  - code: E_NUMBER_UNSOURCED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Number or digit-bearing word {token} in {field} has no source (rule {rule})."
    fix: "Digits: write {{{{fact:<key>}}}} or {{{{calc:...}}}} (two braces on each side), or quote the code line that holds the value; nearest allowed: {values}. A word with digits must be an identifier spelled exactly as in the pinned code."
  - code: E_NUMBER_FORMAT
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Number word or format {token} is not allowed in report text (rule {rule})."
    fix: "Write the amount as a code literal quoted from the pinned lines or as a {{{{fact:<key>}}}} or {{{{calc:...}}}} placeholder (two braces on each side), or drop the quantity; a count of code things in words (two pools, the third call) needs no source."
  - code: E_NUMBER_UNIT
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Unit contradicts identifier {ident}."
    fix: "Use unit {unit}."
  - code: E_NUMBER_CONTEXT
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Fact {key} used against its meaning {tag}."
    fix: "Allowed uses: {uses}."
  - code: E_LINEREF_OUTSIDE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Line reference {ref} outside this finding's quotes."
    fix: "Quote the range or remove the reference."
  - code: E_CALC_SYNTAX
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "calc placeholder does not parse."
    fix: "Grammar: {grammar}."
  - code: E_PLACEHOLDER_SYNTAX
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "Placeholder {token} in {field} has one brace on a side; the report would print it as written."
    fix: "Write {example} (two braces on each side). The report expands {{{{fact:<key>}}}}, {{{{calc:<expr>|<precision>}}}} and {{{{finding:<draft_key>}}}} only."
  - code: E_CLAIM_UNSUPPORTED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "The sentence {match} in {field} states that the owner and the deployer are the same account; the recorded facts do not support it ({facts})."
    fix: "{hint}"
  - code: E_CALC_ROUNDING
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "calc decimals not allowed for {fn}."
    fix: "Use {decimals} decimals."
  - code: E_FINDING_REF_UNKNOWN
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "write tools with text"
    what: "{{{{finding:{key}}}}} names no draft."
    fix: "Valid keys: {keys}."
  - code: E_CATEGORY_UNKNOWN
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Category {value} is not in the {family} list."
    fix: "Use one of: {list}."
  - code: E_CATEGORY_MISMATCH
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Category differs from linked lead {lead}."
    fix: "Use {category}."
  - code: E_MATRIX_FIELD
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Matrix {field} contradicts the map."
    fix: "Allowed: {values}."
  - code: E_MATRIX_EVIDENCE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Matrix {field} needs a {role} quote."
    fix: "Add the quote."
  - code: E_ABSENCE_FALSE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Absence claim contradicted at {lines}."
    fix: "Remove or correct the claim."
  - code: E_ABSENCE_UNCHECKABLE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Absence claim cannot be checked without a map."
    fix: "Rephrase without the quantifier."
  - code: E_ABSENCE_UNRESOLVED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Absence or universal phrase {match} in {field} has no absence_claims entry."
    fix: "Add an absence_claims entry whose says text contains {match} (kind no_guard, all_paths_unguarded, no_reads, no_writes or no_calls; scope entry_function, unit or in_scope_files), or reword it as a statement about the quoted lines without the universal word."
  - code: E_ABSENCE_KIND
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Claim kind does not fit its target or scope."
    fix: "Allowed kinds: {kinds}."
  - code: E_FIELD_FIXED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Field {field} is fixed on a server draft."
    fix: "Send only title and body."
  - code: E_SERVER_DRAFT
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "withdraw"
    what: "Server drafts cannot be withdrawn."
    fix: "Write title and body with review_submit_finding."
  - code: E_DUPLICATE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Same family and overlapping range as {draft} ({no})."
    fix: "Revise that draft, merge with merged_into, or set distinct_from."
  - code: E_DISTINCT_INVALID
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "distinct_from without the required difference."
    fix: "{difference}."
  - code: E_DISPROVED_LOCKED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Location overlaps lines locked for this category by kill item {item} of {draft}."
    fix: "Leave the claim withdrawn; a claim of another category on these lines is filed under its own category and checklist."
  - code: E_LEAD_NO_OVERLAP
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "Lead {lead} does not overlap a quote."
    fix: "Lead range: {range}."
  - code: E_DOC_NOT_USER_SUPPLIED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "documented_intent_ref is not in a user-supplied document."
    fix: "Name the document in doc_paths in a new review, or drop the field."
  - code: E_RETRY_BUDGET
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "6 rejected submissions for {draft}."
    fix: "Drop the draft or rewrite it under a new key."
  - code: E_REVISION_CONFLICT
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "submit, answer"
    what: "Revision is now {revision}."
    fix: "Resend with revision {revision}."
  - code: E_LEAD_NOT_FOUND
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "dismiss, submit"
    what: "Unknown lead {lead}."
    fix: "List leads with review_leads."
  - code: E_DRAFT_STATUS
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "challenge, answer"
    what: "Draft {draft} is {status}, not needs_challenge."
    fix: "A needs_text draft takes review_submit_finding first. An accepted or withdrawn draft opens a new revision and a new challenge when the finding is resubmitted with changed text."
  - code: E_FINDING_NOT_FOUND
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "challenge, withdraw, answer"
    what: "Unknown draft {draft}."
    fix: "See review_status drafts."
  - code: E_WITHDRAW_EVIDENCE
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "withdraw"
    what: "disproved needs 1 to 3 quoted code lines; merged_into needs a live target in the same family."
    fix: "Add the quotes or a valid target."
  - code: E_DISMISS_COMMENT_ONLY
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "dismiss"
    what: "Guard quote is a comment."
    fix: "Quote a code line."
  - code: E_DISMISS_UNCHECKABLE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "dismiss"
    what: "The server cannot check this dismissal: {reason}."
    fix: "Give the evidence the reason names (a quote in the right scope, the map, a different reason), or promote the lead and challenge it."
  - code: E_DUPLICATE_TARGET
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "dismiss"
    what: "duplicate_of target fails rule {rule}."
    fix: "Target an accepted or needs_challenge draft of the same family and equal or higher severity."
  - code: E_FIX_NOT_EVIDENT
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "dismiss"
    what: "Carried lead {lead_id} closes only as fixed: a kill item answered present by new-pin quotes in its scope, at least one on a line whose code differs from the re-review snapshot after comments, whitespace and line endings are removed, or a location unreachable now and reachable at the earlier pin. Other reasons, unchanged code and an unknown earlier reachability are not evidence."
    fix: "Quote the added or changed code lines that remove the issue; if the issue is still present, promote the lead; if left open, it is reported as Not verified as fixed and counted."
  - code: E_CHALLENGE_INCOMPLETE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "answer"
    what: "Missing items: {ids}."
    fix: "Answer every item from review_challenge."
  - code: E_SEVERITY_CONFIRM
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "submit"
    what: "The matrix computes {computed} by {rule}; {why}. This round trip does not count against the retry budget."
    fix: "Resend with claimed_severity {computed} to confirm it, or keep a value within one step of {computed} and add the argument severity_reason (a string of 20 to 200 characters, for example severity_reason: \"The balance is zero and the constructor already ran, so no value is at risk\"; it is a top-level argument of review_submit_finding next to claimed_severity), or reclassify the matrix: reversibility admin_reversible or self_recovering, magnitude residual or bounded with a bound_ref quote, impact griefing_with_victim_loss when the actor harms only itself, precondition victim_unusual_action."
  - code: E_CHALLENGE_SCOPE
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "answer"
    what: "Item {item}: not covered or not read: {ranges}."
    fix: "For an absent answer, refs must cover every scope range of that item after reading them with review_read_code; one wider ref per file that contains the ranges also counts. For present, quote inside the ranges."
  - code: E_CHALLENGE_CONTRADICTS_AUTO
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "answer"
    what: "Answer contradicts the server check: {auto}."
    fix: "Answer per the evidence lines."
  - code: E_CHALLENGE_COMMENT_ONLY
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "answer"
    what: "present quote is a comment."
    fix: "Quote a code line."
  - code: E_CHALLENGE_NA_REASON
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "answer"
    what: "Reason not allowed for this item."
    fix: "Allowed: {reasons}."
  - code: E_SECTION_INVALID
    owner: "03"
    channel: "rejection"
    class: "input"
    tools: "set_section"
    what: "Section content invalid: {detail}."
    fix: "Example: {example}."
  - code: E_COVERAGE_NA_UNCONFIRMED
    owner: "04"
    channel: "rejection"
    class: "input"
    tools: "set_section"
    what: "Not-applicable reason not confirmed by the map."
    fix: "Leave the computed status."
  - code: E_PROOF_SIG_INVALID
    owner: "04"
    channel: "claim page"
    class: "input"
    tools: "claim page"
    what: "Signature does not verify."
    fix: "Sign the exact message shown."
  - code: E_PROOF_NOT_AUTHORITY
    owner: "04"
    channel: "claim page"
