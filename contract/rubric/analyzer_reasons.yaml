# Plain sentences for an analyzer that did not run, or ran degraded (review_status `analyzer_note`,
# report method table). MetaDAO blind run 2026-10-31: analyzer_degraded true with no reason anywhere
# (the cause, cargo-audit without its RustSec snapshot, sat only in the worker's static_map.json).
#
# A reason code is matched by its first segment (before the first colon); the rest of the code
# (host paths, provider text) is never printed. Unknown codes print as words. A static_map `cause`
# (BakerFi 2026-10-31: the class of the first solc error of the Slither compilation) is printed after
# the sentence with `cause_sentence`. Only these fixed texts, a reviewed file path and a line number
# are printed: analyzer output quotes the client's code and is never relayed.

reasons:
  rustsec_db_not_found: the RustSec advisory snapshot was not available on the server, so dependency advisories were not checked
  rustsec_db_stale: the RustSec advisory snapshot is older than the freshness limit, so recent advisories may be missing
  build_failed: the build failed, so there was no compiled code to analyze
  analyzer_failed: it stopped with an internal error
  compile_failed: the compiler run it drives over the reviewed files failed, so it produced no detector leads; read the reviewed files without static-analysis leads
  internal_error: it stopped with an internal error, so it produced no detector leads
  no_entry: no reviewed source file could be given to it, so it produced no detector leads
  sandbox_unavailable: the analysis sandbox was not available on the server
  no_output: it produced no output
  not_available: it is not available for this language
  step_deadline: the analysis step ran out of time
  timeout: it ran out of time
  not_run: it did not run
build_prefix: "the build did not finish ({detail}), so there was no compiled code to analyze"
sentence: "{tool} did not run fully: {reason}."
cause_sentence: "Cause: {cause}."
cause_location: "{cause} in {file} at line {line}"
causes:
  identifier_already_declared: two compiled files declare the same name in one compilation unit
  version_mismatch: a source file requires a different compiler version
  source_not_found: an imported source file was not found
  parser_error: the compiler could not parse a source file
  type_error: the compiler rejected a type in a source file
  declaration_error: the compiler rejected a declaration in a source file
  json_decode_error: the analyzer could not read the compiler output
  invalid_compilation: the analyzer could not compile the sources
  slither_error: the analyzer raised an error while processing the compiled code
  other: the compiler or the analyzer reported an error of another kind
unknown: An analyzer did not run fully, and the run did not record why.
