# Other closed enums (owner part 04). Labels for the report live in the report kit (part 08).
matrix:
  impact_class: [theft_of_funds, permanent_freeze, temporary_freeze, insolvency_or_bad_debt, control_takeover,
                 yield_or_fee_loss, unauthorized_state_change, griefing_with_victim_loss, dos_core_function,
                 dos_noncore_function, incorrect_accounting_no_fund_effect, spec_deviation_bounded,
                 centralization_risk, best_practice]
  magnitude: [unbounded, bounded, dust]
  trigger: [anyone, permissionless_role, privileged_role, privileged_role_unprotected, upgrade_authority]
  precondition: [none, normal_operation, market_condition, timing_or_ordering, uncommon_protocol_state,
                 external_failure, victim_unusual_action]
  reversibility: [irreversible, admin_reversible, self_recovering]
quote_role: [location, bound_ref, role_path, context]
section: [roles_notes, out_of_scope_reasons, coverage, context_notes]   # review_set_section; context_notes: context ingestion spec 6 and 7
finding_status: [needs_text, needs_challenge, accepted, withdrawn]
evidence_level: [analyzer_and_reasoning, reasoning_challenged, reasoning_only]
lead_state: [open, promoted, merged, dismissed, not_reviewed]
lead_origin: [analyzer, previous_report]
dismissal_reason:
  model: [fp_guarded, fp_unreachable, not_a_vulnerability, duplicate_of, fixed]   # fixed: previous_report leads only (03); not_a_vulnerability: analyzer leads only, quote in the lead's function + note >= 40 chars (04 10)
  server: [out_of_scope, disproved_by_challenge, not_reviewed]   # out_of_scope: analyzer leads only (04 10)
absence_kind: [no_reads, no_writes, no_calls, no_guard, all_paths_unguarded]
absence_scope: [in_scope_files, unit, entry_function]
guard_classes: [caller_check, reentrancy_lock, initializer_guard, pause_check]   # families may append, e.g. solana signer_constraint
dep_match: [exact, metadata_only, third_party_verified_only, mismatch, not_checkable]
live_match: [matched, not_matched, unknown]
profile: [public_review, owner]
coverage_status: [read, partially_read, not_covered, no_candidates, not_applicable]
challenge_value: [present, absent, not_applicable]
checklist_kind: [kill, downgrade, context, basis]
challenge_scope: [entry_function, call_site, shared_state_writers, account_struct, handler, module]
na_reasons: [nr_no_external_call, nr_no_delegatecall, nr_no_oracle, nr_no_signature_check, nr_no_token_transfer,
             nr_no_loop_over_storage, nr_no_proxy, nr_no_upgrade_path, nr_no_randomness_source, nr_no_timestamp_use]
