# rubric/severity_rules.yaml (owner part 04, section 7.4). The named rules the severity engine may apply
# on top of the IxL cell (engine/severity.py). Every verdict and the report's severity table name the
# rules that moved the value, so a client can dispute a rule by id. Reference data: the ids and the
# effect are what the engine does; `why` records the calibration decision behind the rule.
#
# Thin server (CEO decision 2026-10-31, blind rounds 1 to 5): the reviewer's claimed_severity is the printed
# severity, always. The rules below compute the calibration: the matrix cell and every cap or step that
# applies. The report prints "Calibration: <severity> (<rule>)" beside a finding whose calibration differs; no
# rule raises, lowers or caps the printed value and the server never asks the reviewer to confirm. Without a
# claim, the matrix outcome accepted at submit prints and later phases keep it.
version: 3
one_step: 1          # RV1 tolerance and DG1 floor, in severity steps
reason_min_chars: 20 # severity_reason length RV1 needs
rules:
  - {id: K1, phase: all, kind: cap, ceiling: Medium,
     condition: "trigger privileged_role or upgrade_authority (a trusted role) and the TR1 waiver does not apply",
     why: "A trusted role is a centralization risk, not an attacker; the matrix prints it as Medium at most."}
  - {id: K3, phase: all, kind: cap, ceiling: Low, condition: "magnitude dust (a rounding artefact)"}
  - {id: K4, phase: finalize, kind: cap, ceiling: Low,
     condition: "evidence reasoning_only at finalize: a draft that never took a challenge and quotes no deployed code",
     why: "Since 2026-10-27 (never-worse, gate_policy.yaml F3) the challenge is optional: a draft finalized without it keeps its severity and prints evidence reasoning_only with a coverage note, so K4 no longer caps it. K8 still caps an unchallenged Critical at High."}
  - {id: K5, phase: "post_challenge, finalize", kind: step, effect: "minus one level on the calibration",
     condition: "a downgrade item of the checklist answered present",
     why: "One step since 2026-10-27 (was two): the second step needs a kill item (see DG1)."}
  - {id: K6, phase: all, kind: cap, ceiling: Low, condition: "precondition victim_unusual_action"}
  - {id: K7, phase: all, kind: cap, ceiling: Low, condition: "impact centralization_risk"}
  - {id: K8, phase: "post_challenge, finalize", kind: cap, ceiling: High,
     condition: "Critical without evidence reasoning_challenged or analyzer_and_reasoning, or without attack_steps, or with an open downgrade item"}
  - {id: K10, phase: "post_challenge, finalize", kind: cap, ceiling: High,
     condition: "no contract map for the job (scopes are lexical). A checklist item whose scope the map cannot supply applies no cap since 2026-10-27: its present answer is unverifiable and rejected, its absent answer stands"}
  - {id: K11, phase: all, kind: cap, ceiling: High,
     condition: "generic category without a linked analyzer lead of the same category"}
  - {id: "max_severity", phase: all, kind: cap, ceiling: "the category's max_severity (enums.yaml)",
     condition: "the category carries max_severity (best_practice, source_text_integrity: Informational)"}
  - {id: IRR1, phase: all, kind: likelihood, effect: "precondition uncommon_protocol_state counts as L2, not L1",
     condition: "impact theft_of_funds, permanent_freeze, insolvency_or_bad_debt or supply_inflation; magnitude unbounded; reversibility irreversible; trigger permissionless",
     why: "Irreversibility outweighs state rarity. Apyee V2 F-01 (2026-10-26): a permanent freeze of all funds that anyone can trigger once supply returns to zero printed Medium under I4xL1; the independent judge and the reviewer both read it as High. I4xL2 = High."}
  - {id: TR1, phase: all, kind: likelihood, effect: "trigger privileged_role is treated as privileged_role_unprotected and K1 is waived",
     condition: "retail-token profile (an ERC-20 unit whose owner can move, seize, block or dilute balances); impact theft_of_funds, permanent_freeze, insolvency_or_bad_debt, control_takeover or supply_inflation; trigger privileged_role; reversibility irreversible",
     why: "For a retail token the owner is the threat, so an owner path to a loss with no undo (mint to self, drain, brick) is as reachable as a public one. Since 2026-10-27 the waiver needs reversibility irreversible: an owner action the owner can undo is a centralization risk and keeps the K1 Medium cap. Decision on the owner pause (BNB ANTTIME F-01, blind run 2026-10-26): pause is admin_reversible by construction; the irreversible branch needs the owner to renounce while paused, which is self-sabotage, not an attack, and no funds move. Public practice agrees: Code4rena and Sherlock file admin pause or blocklist powers as centralization findings at Medium or below unless the role is unprotected. Under this rubric an owner pause prints Medium (I3xL3 = High, K1 cap). A pause with no unpause function, or a renounce that cannot be undone inside the pause path, is reversibility irreversible and prints High under TR1."}
  - {id: RV1, phase: all, kind: reviewer, effect: "claimed_severity is the printed severity; the matrix outcome is printed beside it as a calibration when it differs",
     condition: "claimed_severity given (severity_reason is optional and printed when given)",
     why: "Blind rounds 2026-10-26 to 2026-10-31: where matrix and reviewer differed the reviewer was right more often (round 5: 7 to 3), and five of round 5's twelve severity errors were server overrides of a correct reviewer. CEO decision 2026-10-31: the reviewer's severity is final."}
  - {id: DG1, phase: "post_challenge, finalize", kind: retired, effect: "none",
     condition: "retired 2026-10-31",
     why: "A challenge never moves the printed severity, so there is no downgrade to floor."}
