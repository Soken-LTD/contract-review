# Learning loop configuration (learning-loop design 2026-10-27, sections 2.1, 2.2, 2.7).
# Every threshold, label and protected rule lives here; the Python reads this file and holds none
# of its own. Tier policy versions are immutable files in rule_tiers/<version>.yaml, generated by
# scripts/learning_tiers.py recompute and merged by pull request after review.
version: 1

# Which policy review_leads applies. The `flags` row `learning.rule_tiers` overrides it:
#   {"version": "<id>"}     activate a reviewed version
#   {"rollback": true}      show every lead as the baseline (no tiers) on the next call
# With no flag row the default below applies; the baseline changes nothing.
default_version: baseline
baseline_version: baseline
flag_key: learning.rule_tiers

# Anonymisation (design 2.7). The salt is a secret from the environment, rotated yearly; the id
# names the key in every row so distinct counts stay within one key. Without the salt the
# current report key is used (as quota.py does), so the ledger never stops writing.
salt:
  env: SOKEN_LEARNING_SALT
  id_env: SOKEN_LEARNING_SALT_ID
  previous_env: SOKEN_LEARNING_SALT_PREV
  previous_id_env: SOKEN_LEARNING_SALT_PREV_ID
  min_bytes: 32
  tag_hex: 16
release_env: SOKEN_RELEASE

# Generator rules (design 2.2). No automatic tier change below the minimum sample.
window_days: 180
min_sample:
  triaged: 20
  targets: 5
  principals: 3
  max_principal_share: 0.2
# First release (CEO open decision 1): internal traffic is one principal, so demotion alone may
# act on one principal. Collapse and boost keep the full minimum sample.
demote_min_sample:
  triaged: 20
  targets: 5
  principals: 1
  max_principal_share: 1.0
thresholds:
  demote: {p_ub_below: 0.10}
  collapse: {p_ub_below: 0.03, triaged: 50, targets: 8}
  boost: {p_ge_medium_lb_at_least: 0.25, triaged: 10, targets: 3}
  restore: {p_lb_at_least: 0.15}
  severity_down: {ge_medium_ub_below: 0.10, promoted_min: 5}
  severity_up: {above_norm_share_at_least: 0.6, promoted_min: 5, ceiling: High}
  swing_hold: {p_delta_above: 0.2}
max_tier_steps_per_version: 1

# Exploration (design 2.2 rule 4): a sample of demoted and collapsed leads is shown in its normal
# place, at its analyzer severity, labelled as a calibration sample, so a demoted rule keeps
# producing outcomes and can come back.
exploration:
  rate: 0.10
  max_per_job: 5
  tiers: [demoted, collapsed]

# Protected rules (design 2.2 rule 5): never demoted, collapsed or shifted down by the generator.
# Our own lifecycle rules are protected by tool; judge-confirmed rules are added from
# judge_verdicts (real, judge severity Medium or above) and from public-code promotions that
# printed High or above. A manual demotion of a protected rule is a reviewed policy edit.
protected:
  tools: [soken-lifecycle]
  rules:
    - {tool: soken-lifecycle, rule: LC-EVM-EMPTY,
       evidence: "matrix-run-2026-10-26/JUDGEMENT.md s.5 A1 (blind, judge-confirmed)"}
  judge_min_severity: Medium
  promoted_min_printed: High

# Tier semantics in review_leads (design 2.2 tier table). Order: lower rank is listed first.
tiers:
  boosted: {rank: 0, severity_shift: 0, listed: true}
  normal: {rank: 1, severity_shift: 0, listed: true}
  explore: {rank: 1, severity_shift: 0, listed: true}
  demoted: {rank: 2, severity_shift: -1, listed: true}
  collapsed: {rank: 3, severity_shift: -2, listed: false}

# Server labels printed by review_leads and the report (reference data, substitution of numbers
# and identifiers only).
labels:
  lead_suffix:
    boosted: "tier boosted (historically precise rule)"
    demoted: "tier demoted, analyzer {analyzer_severity}"
    collapsed: "tier collapsed, analyzer {analyzer_severity}"
    explore: "calibration sample"
  header: "rule tiers {version}: {demoted} demoted, {collapsed} collapsed{collapsed_hint}"
  collapsed_hint: " (include_collapsed true, or detector naming the rule, lists them)"
