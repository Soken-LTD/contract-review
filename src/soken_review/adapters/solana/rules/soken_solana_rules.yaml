# soken-solana-rules v0.1.0 (06 section 3.5)
# Rule pack for Solana programs: Anchor, native, Pinocchio.
# Each rule is reference data only; finding text is generated by the model.
# Rule ids, categories, and checklist items are rubric data.
# Severity is SARIF level: error/warning/note/none.
# The matcher (matcher.py) emits lead.v1 documents from the extract output.
---
version: "0.1.0"
family: solana
rules:
  - id: SOL-ACC-01
    category: solana.missing_signer
    severity: error
    description: "Value moved or state mutated without a signer check on the authority account."
    # Fires when: value moved or state mutated, no signer check
    # Exempt: PDA-signed crank (confidence low)
    patterns:
      anchor:
        - account_without_signer: true
          has_mutation: true
      native:
        - unchecked_signer: true

  - id: SOL-ACC-02
    category: solana.missing_owner_check
    severity: error
    description: "Account data read without an owner check."
    patterns:
      anchor:
        - account_info_read_unchecked: true

  - id: SOL-ACC-03
    category: solana.type_confusion
    severity: error
    description: "Manual deserialization without a discriminator check."
    patterns:
      anchor:
        - manual_deserialize_no_discriminator: true

  - id: SOL-ACC-04
    category: solana.account_relationship
    severity: warning
    description: "Stored Pubkey field not linked to the account via has_one/constraint/address."
    patterns:
      anchor:
        - pubkey_field_not_constrained: true

  - id: SOL-ACC-05
    category: solana.duplicate_mutable
    severity: warning
    description: "Two mutable accounts of one type without a key inequality check."
    patterns:
      anchor:
        - duplicate_mutable_without_constraint: true

  - id: SOL-ACC-06
    category: solana.sysvar_address
    severity: warning
    description: "Sysvar loaded from AccountInfo without address check."
    patterns:
      anchor:
        - sysvar_unchecked: true

  - id: SOL-ACC-07
    category: solana.remaining_accounts
    severity: warning
    description: "remaining_accounts element used without owner, key, or discriminator check."
    patterns:
      anchor:
        - remaining_accounts_unchecked: true

  - id: SOL-PDA-01
    category: solana.pda_seeds
    severity: error
    description: "PDA bump taken from input instead of stored canonical bump."
    patterns:
      anchor:
        - bump_from_input: true

  - id: SOL-PDA-02
    category: solana.pda_sharing
    severity: warning
    description: "Vault PDA shared across users/mints without per-user/per-mint key in seeds."
    patterns:
      anchor:
        - pda_shared_vault: true

  - id: SOL-PDA-03
    category: solana.seed_collision
    severity: warning
    description: "Adjacent variable-length seeds without separator."
    patterns:
      anchor:
        - adjacent_variable_length_seeds: true

  - id: SOL-PDA-04
    category: solana.precreation
    severity: warning
    description: "init on an address anyone can fund first."
    patterns:
      anchor:
        - init_precreation_risk: true

  - id: SOL-CPI-01
    category: solana.arbitrary_cpi
    severity: error
    description: "CPI target taken from an unchecked account (not Program<T> or id-checked)."
    patterns:
      anchor:
        - cpi_unchecked_target: true
      native:
        - invoke_unchecked_program: true

  - id: SOL-CPI-02
    category: solana.signed_cpi_accounts
    severity: error
    description: "invoke_signed passes an unchecked user-supplied writable account."
    patterns:
      native:
        - invoke_signed_unchecked_writable: true

  - id: SOL-CPI-03
    category: solana.stale_after_cpi
    severity: warning
    description: "Account data read after a CPI without reload() or re-borrow."
    patterns:
      anchor:
        - stale_after_cpi: true

  - id: SOL-CPI-04
    category: solana.cpi_recursion
    severity: warning
    description: "Direct self-CPI with data touched before and after."
    patterns:
      anchor:
        - self_cpi: true

  - id: SOL-ATA-01
    category: solana.ata_owner_reassign
    severity: error
    description: "Classic token account with authority from a non-signer — owner can be reassigned (F11). Use Token-2022 or add alternative withdrawal path."
    patterns:
      anchor:
        - ata_authority_not_signer: true
          token_program_not_token2022: true
          payout_direction: "push"

  - id: SOL-ATA-02
    category: solana.ata_validation
    severity: warning
    description: "ATA checked only by owner or only by derivation, not both."
    patterns:
      anchor:
        - ata_partial_validation: true

  - id: SOL-CLOSE-01
    category: solana.close_revival
    severity: error
    description: "Account closed without zeroing data or reassigning to system program."
    patterns:
      native:
        - close_without_zero: true

  - id: SOL-CLOSE-02
    category: solana.close_revival
    severity: warning
    description: "Closed account can be reused in the same transaction after refund."
    patterns:
      anchor:
        - close_reuse_in_tx: true

  - id: SOL-INIT-01
    category: solana.reinitialization
    severity: error
    description: "init_if_needed overwrites authority or balance fields unconditionally."
    patterns:
      anchor:
        - init_if_needed_overwrites: true

  - id: SOL-INIT-02
    category: solana.reinitialization
    severity: error
    description: "Native/Pinocchio init without initialized flag or discriminator check."
    patterns:
      native:
        - init_no_guard: true

  - id: SOL-TOK-01
    category: solana.arbitrary_cpi
    severity: error
    description: "Token CPI with unconstrained token_program account."
    patterns:
      anchor:
        - unconstrained_token_program: true

  - id: SOL-TOK-02
    category: solana.token2022_extensions
    severity: warning
    description: "Interface admits Token-2022 but transfer fee or hook is unhandled."
    patterns:
      anchor:
        - token_interface_unhandled_extensions: true

  - id: SOL-ARITH-01
    category: solana.arithmetic
    severity: error
    description: "Unchecked +/-/* on amounts with overflow_checks=false."
    patterns:
      all:
        - unchecked_arithmetic_on_amount: true
          overflow_checks: "off"

  - id: SOL-INTRO-01
    category: solana.introspection
    severity: warning
    description: "Absolute instruction index or loaded program id unchecked."
    patterns:
      all:
        - absolute_ix_index: true
