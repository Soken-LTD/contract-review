name: move-e2e
# Live proof of the Sui and Aptos adapter paths on x86_64 (plan v4 07 4, 6, 7; 09 5.2). Manual.
# The scripts call adapter code only; docker is used here only to build the sandbox images.
on:
  # workflow_dispatch needs the file on main; until the merge it runs on pushes to this branch.
  push:
    branches: [feat/move-adapters]
    paths: [".github/workflows/move-e2e.yml", "src/soken_review/adapters/move/**", "src/soken_review/adapters/sui/**", "src/soken_review/adapters/aptos/**", "src/soken_review/worker/**", "docker/sui-build/**", "docker/aptos-build/**", "scripts/e2e_move_adapter.py", "tests/integration/test_e2e_move.py"]
  workflow_dispatch:
    inputs:
      targets:
        description: "space-separated e2e_move_adapter.py target names (empty = all)"
        default: ""
      chains:
        description: "review_start -> ready chains (aptos,sui)"
        default: "aptos,sui"
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: soken, POSTGRES_PASSWORD: soken, POSTGRES_DB: soken}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U soken" --health-interval 5s --health-retries 20
    env:
      SOKEN_IMAGE_GIT_FETCH: soken/git-fetch:ci
      SOKEN_IMAGE_SUI_BUILD: soken/sui-build:ci
      SOKEN_IMAGE_APTOS_BUILD: soken/aptos-build:ci
      SOKEN_SANDBOX_RUNTIME: runc
      SOKEN_SANDBOX_DEV_PERMS: "1"
      SOKEN_MOVE_NETWORK: soken-move-egress
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --locked
      - name: Build sandbox images
        run: |
          docker build -f docker/git-fetch/Dockerfile -t soken/git-fetch:ci .
          docker build -t soken/aptos-build:ci docker/aptos-build
          docker build -t soken/sui-build:ci docker/sui-build
          docker network create soken-move-egress
          docker network create soken-egress-move
          docker run --rm soken/sui-build:ci sui --version
          docker run --rm soken/aptos-build:ci aptos --version
      - name: Adapter path (chain_state, fetch, sandbox build, comparison, analyze) and negative controls
        env: {TARGETS: "${{ inputs.targets }}"}
        run: uv run python scripts/e2e_move_adapter.py $TARGETS | tee e2e.jsonl
      - name: Cases reach review_leads (scripts/e2e_leads.py)
        if: always()
        run: |
          cases=$(ls -d .sbx/move-e2e/cases/* 2>/dev/null || true)
          if [ -n "$cases" ]; then uv run python scripts/e2e_leads.py $cases; fi
      - name: review_start -> ready -> review_leads through the supervisor
        if: always()
        env:
          SOKEN_DATABASE_URL: postgresql://soken:soken@127.0.0.1:5432/soken
          SOKEN_MOVE_E2E: "1"
          SOKEN_MOVE_E2E_CHAINS: ${{ inputs.chains || 'aptos,sui' }}
        run: uv run pytest -q -s -rs tests/integration/test_e2e_move.py
      - name: Logs
        if: always()
        run: |
          for f in .sbx/move-e2e/*/build/host/*.log; do echo "== $f"; tail -40 "$f"; done || true
