name: solana-images
# Per-version Solana build images (06 3.3.1, U-S1; 09 4.4). One derived image per Solana version
# line: docker/solana-build/Dockerfile stage `build`, FROM the upstream solana-verifiable-build
# digest pinned in src/soken_review/adapters/solana/data/image_map.json, with that row's
# ACTIVE_TOOLCHAIN. Same three-stage shape as images.yml: a build job with no write token (Trivy
# gate: a Critical with a fix blocks), a push job (packages:write, no build) to
# ghcr.io/soken-ltd/solana-build:<version>, then a map job that writes the pushed digests into
# image_map.json `soken_image` (what build_image() runs; a zero digest fails closed) and commits
# them to this branch, never to main. Manual only: four multi-GiB toolchain images per run.
# Never triggered by pull_request: no PR code runs next to a write token.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "space-separated Solana versions with a soken_image row in image_map.json"
        default: "1.18.26 3.1.8 3.1.10 4.3.0"
      commit_map:
        description: "commit image_map.json back to this branch (never main)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: solana-images-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          # shellcheck disable=SC2086  # versions are space-separated on purpose
          PYTHONPATH=src python3 -m soken_review.adapters.solana.images plan $VERSIONS > plan.json
          echo "images=$(cat plan.json)" >> "$GITHUB_OUTPUT"
          python3 -m json.tool plan.json

  build:
    name: build ${{ matrix.image.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/image-build
        with:
          image: ${{ toJSON(matrix.image) }}

  push:
    name: push ${{ matrix.image.name }}
    needs: [plan, build]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, actions: read}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {sparse-checkout: .github/actions/image-push}
      - id: has
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.image.name }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"image-$NAME\")] | length")
          echo "built=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.built == 'true'
        uses: ./.github/actions/image-push
        with:
          name: ${{ matrix.image.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  map:
    needs: push
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: "digest-*", path: results, merge-multiple: true}
      - name: Write digests into image_map.json soken_image
        run: |
          ls results
          PYTHONPATH=src python3 -m soken_review.adapters.solana.images record-digests results | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --stat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: solana-image-map, path: src/soken_review/adapters/solana/data/image_map.json}
      - name: Commit the map to this branch
        if: inputs.commit_map && github.ref != 'refs/heads/main'
        run: |
          git config user.name "soken-ci"
          git config user.email "soken-ci@users.noreply.github.com"
          git add src/soken_review/adapters/solana/data/image_map.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(solana-images): soken_image digests from solana-images run ${{ github.run_id }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
