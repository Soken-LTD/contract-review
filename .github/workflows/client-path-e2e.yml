name: client-path-e2e
# Client-path regression suite (blind matrix runs 2026-10-25/26): the real stack (Postgres on tmpfs,
# HTTP server, worker, egress proxies, sandbox images pulled by the digests in images.lock.json)
# driven through the MCP tools over HTTP as a client session would, one fixture job per released
# family: EVM deployed (WETH9, full reviewer flow with a Medium finding, challenge, every section,
# stale-client JSON-string invariant_walks, PDF), EVM repo with npm deps (Apyee v2.0.0), Solana repo
# (agent-loans programs/locker), TON address (Forton, tier A), TON repo with no chain and no deployment
# (HipoFinance FunC Blueprint repo, third party, family detected from the tree), Solana repo with no deployment
# (Pump Science Anchor workspace), TRON address (CRS). Driver and
# assertions: scripts/client_path_driver.py; stack: scripts/client_path_e2e.py.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "comma-separated targets (evm,evm-proxy,evm-repo,solana,solana-repo,ton,ton-multisig,ton-repo,tron)"
        default: "evm,evm-proxy,evm-repo,solana,solana-repo,ton,ton-multisig,ton-repo,tron"
  push:
    branches: [main, ci/client-path-e2e]
    paths:
      - "src/**"
      - "contract/**"
      - "migrations/**"
      - "images.lock.json"
      - "scripts/client_path_driver.py"
      - "scripts/client_path_e2e.py"
      - ".github/workflows/client-path-e2e.yml"
permissions:
  contents: read
  packages: read

jobs:
  client-path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGETS: ${{ inputs.targets || 'evm,evm-proxy,evm-repo,solana,solana-repo,ton,ton-multisig,ton-repo,tron' }}
      SOKEN_SANDBOX_RUNTIME: runc
      SOKEN_SANDBOX_DEV_PERMS: "1"
      SOKEN_RUSTSEC_DB: ${{ github.workspace }}/.sbx/rustsec-db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk for the Solana images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - name: Pre-pull Postgres (Docker Hub anonymous pulls fail on shared runners)
        run: docker pull -q postgres:16 || { docker pull -q mirror.gcr.io/library/postgres:16 && docker tag mirror.gcr.io/library/postgres:16 postgres:16; }
      - name: Pull the locked sandbox images by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          refs="$(uv run python - <<'EOF'
          from soken_review.sandbox.profile import locked_image
          from soken_review.adapters.solana.images import build_image
          names = ["evm-analyze", "soken-render", "git-fetch", "smokescreen", "ton-build", "tron-analyze", "solana-analyze"]
          refs = [locked_image(n) for n in names] + [build_image("3.1.8").ref, build_image("1.18.26").ref]
          missing = [n for n, r in zip(names + ["solana-build 3.1.8", "solana-build 1.18.26"], refs) if not r]
          assert not missing, f"unpinned images: {missing}"
          print("\n".join(refs))
          EOF
          )"
          echo "$refs" | xargs -P 4 -n 1 docker pull -q
          docker images --digests | grep soken-ltd
          df -h /
      - name: Egress proxies (evm for npm deps, solana for cargo) and the RustSec snapshot
        run: |
          set -euo pipefail
          img="$(uv run python -c 'from soken_review.sandbox.profile import locked_image; print(locked_image("smokescreen"))')"
          uv run python -m soken_review.sandbox.egress up evm --image "$img"
          uv run python -m soken_review.sandbox.egress up solana --image "$img"
          mkdir -p "$SOKEN_RUSTSEC_DB"
          uv run python -m soken_review.adapters.solana.rustsec fetch
      - name: Stack up, drive the targets over HTTP, stack down
        run: uv run python scripts/client_path_e2e.py all --targets "$TARGETS" --parallel 9 --out out
      - name: Stack logs (always)
        if: always()
        run: |
          echo "== server"; tail -n 80 .sbx/cpe/logs/server.log || true
          echo "== worker"; tail -n 150 .sbx/cpe/logs/worker.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: client-path-e2e
          path: |
            out/
            .sbx/cpe/logs/
