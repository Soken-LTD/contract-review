# /r/ report links (review_report url, pdf_url, manage_url), served by the app.
#
# Include inside BOTH server blocks (mcp.soken.dev and soken.dev) on the stand, in place of the
# old PDF alias. Remove this block from both vhosts first; it served
# reports/<id>/1/report.pdf for any query, ignoring the signature (s), the expiry (e), deletion
# and every render after the first:
#
#   location ~ ^/r/(?<rid>[a-z0-9]+)\.pdf$ { alias .../reports/reports/$rid/1/report.pdf; ... }
#
# The app checks the signature and expiry, serves the current render, answers 403 on a bad or
# expired link and 404 on an unknown, deleted or expired report, and sends Cache-Control:
# no-store on every /r/ response. Do not add proxy_cache or expires here.
#
# REPLACE `soken_api` with the limit_req zone the vhost already defines for /mcp (or the one
# already applied to /r/); the manage POST is the endpoint that needs it most.

location ^~ /r/ {
    limit_req zone=soken_api burst=20 nodelay;
    limit_req_status 429;

    client_max_body_size 8k;          # manage POST body is {"key","action"}
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host mcp.soken.dev;   # the app answers /r/ on any host; keep one value
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_buffering on;               # PDFs are a few MB at most
}
