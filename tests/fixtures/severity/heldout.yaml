# Held-out calibration set for the severity engine (2026-10-27). Public findings whose published
# severity is known, none of them from the five 2026-10-26 matrix targets (Lock & Loan, Forton,
# CRS, ANTTIME, Apyee). Each row carries the classification an honest reviewer would pick from the
# finding text alone, plus `published`. `scale` names the publisher's scale: c4 tops at High (no
# Critical), so a computed Critical is scored as agreeing with a published High in the
# scale-adjusted count; soken and gblin scales have a Critical level.
#
# Sources: Code4rena reports 2022-05 Cally and 2022-06 Putty (code4rena.com/reports/<slug>);
# SOKEN public archive (github.com/SokenDev, Solidity-Audit-Reports and Rust-Audit-Reports PDFs);
# GBLIN audit 2026-10-02 (own audit, findings.json). Classifications are the test author's, written
# before the engine was run; disagreements are kept, not tuned away.
cases:
  # ── Code4rena 2022-05 Cally ──────────────────────────────────────────────────────────────
  - id: cally-H-01
    title: no-revert-on-transfer ERC20 tokens can be drained (creator keeps the buyer's premium)
    scale: c4
    published: High
    matrix: {impact_class: theft_of_funds, magnitude: unbounded, trigger: anyone, precondition: normal_operation, reversibility: irreversible}
  - id: cally-H-02
    title: Inefficiency in the Dutch auction due to lower duration
    scale: c4
    published: High
    matrix: {impact_class: spec_deviation_bounded, magnitude: bounded, trigger: anyone, precondition: normal_operation, reversibility: self_recovering}
  - id: cally-H-03
    title: Fake balances for not-yet-existing ERC20 tokens let attackers set traps for future users
    scale: c4
    published: High
    matrix: {impact_class: theft_of_funds, magnitude: unbounded, trigger: anyone, precondition: uncommon_protocol_state, reversibility: irreversible}
  - id: cally-M-01
    title: Owner can modify the feeRate on existing vaults and steal the strike value on exercise
    scale: c4
    published: Medium
    matrix: {impact_class: theft_of_funds, magnitude: unbounded, trigger: privileged_role, precondition: normal_operation, reversibility: irreversible}
  - id: cally-M-03
    title: Users may accidentally overpay in buyOption and the excess is paid to the vault creator
    scale: c4
    published: Medium
    matrix: {impact_class: yield_or_fee_loss, magnitude: bounded, trigger: anyone, precondition: victim_unusual_action, reversibility: irreversible}
  - id: cally-M-04
    title: Vaults steal rebasing tokens' rewards
    scale: c4
    published: Medium
    matrix: {impact_class: yield_or_fee_loss, magnitude: bounded, trigger: anyone, precondition: normal_operation, reversibility: irreversible}
  - id: cally-M-05
    title: Expiration calculation overflows if call option duration is 195 days or more
    scale: c4
    published: Medium
    matrix: {impact_class: dos_core_function, magnitude: bounded, trigger: anyone, precondition: uncommon_protocol_state, reversibility: self_recovering}
  - id: cally-M-06
    title: Owner can set the feeRate above 100 percent and make every exercise revert
    scale: c4
    published: Medium
    matrix: {impact_class: permanent_freeze, magnitude: unbounded, trigger: privileged_role, precondition: normal_operation, reversibility: admin_reversible}
  - id: cally-M-07
    title: Lack of zero amount check lets a user create infinite vaults
    scale: c4
    published: Medium
    matrix: {impact_class: dos_noncore_function, magnitude: dust, trigger: anyone, precondition: none, reversibility: irreversible}
  - id: cally-M-08
    title: Vault is not compatible with fee-on-transfer tokens and such vaults can be exploited
    scale: c4
    published: Medium
    matrix: {impact_class: theft_of_funds, magnitude: bounded, trigger: anyone, precondition: normal_operation, reversibility: irreversible}
  - id: cally-M-09
    title: Use safeTransferFrom instead of transferFrom for ERC721 transfers
    scale: c4
    published: Medium
    matrix: {impact_class: spec_deviation_bounded, magnitude: bounded, trigger: anyone, precondition: uncommon_protocol_state, reversibility: irreversible}
  - id: cally-M-10
    title: createVault does not confirm that tokenType and the token's type agree (NFT stuck)
    scale: c4
    published: Medium
    matrix: {impact_class: permanent_freeze, magnitude: unbounded, trigger: anyone, precondition: victim_unusual_action, reversibility: irreversible}
